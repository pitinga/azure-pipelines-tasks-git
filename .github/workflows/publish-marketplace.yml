name: Publish Git Tasks to Azure DevOps Marketplace

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite PUBLICAR para publicar no Marketplace e concluir GitHub Release'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: git-tasks-marketplace-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLICAR'
    runs-on: ubuntu-latest
    environment: marketplace-production
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use approved release tag when present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("vss-extension.json"))["version"])')
          tag="v$version"
          if sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            git checkout --detach "$sha"
            actual=$(python3 -c 'import json; print(json.load(open("vss-extension.json"))["version"])')
            if [[ "$actual" != "$version" ]]; then
              echo "::error::Tag $tag contem outra versao."
              exit 1
            fi
            echo "Publicando pacote do commit aprovado: $sha"
          else
            echo "Nova versao $tag ainda nao tem tag; sera criada apos publicacao."
          fi
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify Node 24
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Run tests and build tasks
        run: |
          npm test
          npm run build
      - name: Create VSIX
        run: npx --yes tfx-cli@0.24.2 extension create --manifest-globs vss-extension.json --output-path dist
      - name: Verify VSIX
        run: |
          python3 - <<'PY'
          import glob,json,zipfile
          files=glob.glob('dist/*.vsix')
          assert len(files)==1, files
          with zipfile.ZipFile(files[0]) as z:
              names=set(z.namelist())
              assert 'extension.vsixmanifest' in names
              assert 'extension.vsomanifest' in names
              for task in ('GitTag','GitBranch','GitCompare','GitChangelog','GitVerify','GitCommitStatus','GitPullRequest','GitMerge'):
                  spec=json.loads(z.read(task+'/task.json'))
                  assert list(spec['execution'])==['Node24']
                  assert spec['minimumAgentVersion']=='4.265.1'
          m=json.load(open('vss-extension.json'))
          assert m['publisher']=='pitinga'
          assert m['id']=='azure-pipelines-tasks-git'
          assert m['public'] is True
          print('VSIX validado:',files[0])
          PY
      - name: Publish to Marketplace
        shell: bash
        env:
          VS_MARKETPLACE_TOKEN: MARKETPLACE_${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$VS_MARKETPLACE_TOKEN" ]]; then
            echo "::error::Configure VS_MARKETPLACE_TOKEN no environment marketplace-production."
            exit 1
          fi
          package=$(find dist -maxdepth 1 -type f -name '*.vsix' -print -quit)
          test -n "$package"
          npx --yes tfx-cli@0.24.2 extension publish \
            --publisher pitinga \
            --vsix "$package" \
            --auth-type pat \
            --token "$VS_MARKETPLACE_TOKEN"
      - name: Register tag and final GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("vss-extension.json"))["version"])')
          tag="v$version"
          sha=$(git rev-parse HEAD)
          package=$(find dist -maxdepth 1 -type f -name '*.vsix' -print -quit)
          test -n "$package"
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [[ "$existing" != "$sha" ]]; then
              echo "::error::Tag $tag aponta para $existing; nao sera movida."
              exit 1
            fi
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$package" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release create "$tag" "$package" --repo "$GITHUB_REPOSITORY" --target "$sha" --title "Git Tasks $version" --generate-notes --latest
          fi
          echo "Marketplace publicado e GitHub Release $tag concluida."
